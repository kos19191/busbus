name: android
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths:
      - 'apk/**'
      - 'web/**'
      - 'core/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS deps and build single-file bundle
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund)
          (cd core && npm run typecheck)
          (cd web && npm run build:android)
          ls -la apk/app/src/main/assets/

      - name: Build APK
        working-directory: apk
        run: |
          gradle --no-daemon assembleDebug --stacktrace
          mkdir -p ../ci/apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus.apk

      - name: Sign info / size
        run: |
          ls -la ci/apk
          du -h ci/apk/busbus.apk

      - name: Publish APK to ci/shots branch
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/apk/busbus.apk ci/apk/busbus-debug.apk
          git commit -m "ci: apk $(date -u +%F-%H%M)" || true
          git push origin HEAD:refs/heads/ci/shots --force

      - uses: actions/upload-artifact@v4
        with:
          name: busbus-apk
          path: ci/apk/busbus.apk
          retention-days: 30

  emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build single-file bundle and APK
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund && npm run build:android)
          (cd apk && gradle --no-daemon assembleDebug)
          cp apk/app/build/outputs/apk/debug/app-debug.apk /tmp/busbus-debug.apk
      - name: Install app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            adb install -r /tmp/busbus-debug.apk
            adb shell pm grant ru.busbus.app.debug android.permission.ACCESS_FINE_LOCATION || true
            adb shell am start -n ru.busbus.app.debug/ru.busbus.app.MainActivity
            sleep 15
            mkdir -p ci/device
            adb exec-out screencap -p > ci/device/01-start.png
            adb shell input tap 500 1500 || true
            sleep 3
            adb exec-out screencap -p > ci/device/02-tap.png
            adb logcat -d -v brief | grep -iE "chromium|console|CORS|busbus" | tail -60 > ci/device/logcat.txt || true
            ls -la ci/device
      - name: Publish device screenshots
        if: always()
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/device/* || true
          git commit -m "ci: device screenshots" || true
          git push origin HEAD:refs/heads/ci/device --force || true

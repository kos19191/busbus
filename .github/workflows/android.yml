name: android
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths:
      - 'apk/**'
      - 'web/**'
      - 'core/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS deps and build single-file bundle
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund)
          (cd core && npm run typecheck)
          (cd web && npm run build:android)
          ls -la apk/app/src/main/assets/

      - name: Build APK
        working-directory: apk
        run: |
          gradle --no-daemon assembleDebug --stacktrace
          mkdir -p ../ci/apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus.apk

      - name: Sign info / size
        run: |
          ls -la ci/apk
          du -h ci/apk/busbus.apk

      - name: Publish APK to ci/shots branch
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/apk/busbus.apk ci/apk/busbus-debug.apk
          git commit -m "ci: apk $(date -u +%F-%H%M)" || true
          git push origin HEAD:refs/heads/ci/shots --force

      - uses: actions/upload-artifact@v4
        with:
          name: busbus-apk
          path: ci/apk/busbus.apk
          retention-days: 30

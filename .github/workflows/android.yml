name: android
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths:
      - 'apk/**'
      - 'web/**'
      - 'core/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS deps and build single-file bundle
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund)
          (cd core && npm run typecheck)
          (cd web && npm run build:android)
          ls -la apk/app/src/main/assets/

      - name: Build APK
        working-directory: apk
        run: |
          gradle --no-daemon assembleDebug --stacktrace
          mkdir -p ../ci/apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus.apk

      - name: Sign info / size
        run: |
          ls -la ci/apk
          du -h ci/apk/busbus.apk

      - name: Publish APK to ci/shots branch
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/apk/busbus.apk ci/apk/busbus-debug.apk
          git commit -m "ci: apk $(date -u +%F-%H%M)" || true
          git push origin HEAD:refs/heads/ci/shots --force

      - uses: actions/upload-artifact@v4
        with:
          name: busbus-apk
          path: ci/apk/busbus.apk
          retention-days: 30

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: KVM availability
        run: |
          echo "kvm device:"; ls -la /dev/kvm || true
          grep -cE "vmx|svm" /proc/cpuinfo || true
          nproc
      - name: Build APK and install to a software emulator (best effort)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off
          disable-animations: true
          script: |
            adb install -r apk/app/build/outputs/apk/debug/app-debug.apk || exit 0
            adb shell am start -n ru.busbus.app.debug/ru.busbus.app.MainActivity
            sleep 20
            mkdir -p ci/device
            adb exec-out screencap -p > ci/device/01-start.png
            adb logcat -d | grep -iE "chromium|console|CORS|busbus|Bridge" | tail -80 > ci/device/logcat.txt
            adb shell am force-stop ru.busbus.app.debug
      - name: Publish device screenshots
        if: always()
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/device/* 2>/dev/null || true
          git commit -m "ci: device screenshots" 2>/dev/null || true
          git push origin HEAD:refs/heads/ci/device --force 2>/dev/null || true

name: device-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund && npm run build:android)
          (cd apk && gradle --no-daemon assembleDebug)

      - name: Install emulator deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libnss3 libxrandr2 libglu1-mesa 2>&1 | tail -2 || true
          ls "$ANDROID_HOME/emulator" 2>/dev/null | head -3

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-34;google_apis;x86_64" --force 2>&1 | tail -3

      - name: Boot emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel auto -no-snapshot > emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for i in $(seq 1 90); do
            boot=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" = "1" ]; then echo "booted after $i"; break; fi
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" devices

      - name: Install and run app
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          $ADB install -r apk/app/build/outputs/apk/debug/app-debug.apk
          $ADB shell pm grant ru.busbus.app.debug android.permission.ACCESS_FINE_LOCATION || true
          $ADB shell am start -n ru.busbus.app.debug/ru.busbus.app.MainActivity
          sleep 12

      - name: Check network inside emulator
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo "--- device can reach NSK?"
          $ADB shell "ping -c 1 -W 3 map.nskgortrans.ru" || true
          $ADB shell "ping -c 1 -W 3 mu-kgt.ru" || true

      - name: Screenshots from device
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p ci/device
          $ADB exec-out screencap -p > ci/device/01-start.png
          $ADB shell input tap 300 700 || true
          sleep 2
          $ADB exec-out screencap -p > ci/device/02-tap.png
          ls -la ci/device
          $ADB logcat -d -v brief | grep -iE "busbus|chromium|console|CORS" | tail -80 > ci/device/logcat.txt || true
          head -40 ci/device/logcat.txt || true

      - name: Publish
        if: always()
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/device/* || true
          git commit -m "ci: device screenshots" || true
          git push origin HEAD:refs/heads/ci/device --force

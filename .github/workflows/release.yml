name: release

# Собирает APK и публикует GitHub Release с вложенным файлом.
# Запуск: пуш тега вида v1.2.0, либо вручную (тогда релиз не создаётся).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps and build single-file bundle
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run typecheck)
          (cd web && npm ci --no-audit --no-fund && npm run build:android)

      - name: Build APKs
        working-directory: apk
        run: |
          gradle --no-daemon assembleRelease assembleDebug --stacktrace
          mkdir -p ../ci/apk
          cp app/build/outputs/apk/release/app-release.apk ../ci/apk/busbus.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ci/apk/busbus-debug.apk

      # Подпись: если в секретах есть keystore — подписываем им, иначе остаётся debug-ключ
      - name: Sign with keystore (if secrets are set)
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.BUSBUS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BUSBUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUSBUS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BUSBUS_KEY_PASSWORD }}
        run: |
          set -e
          [ -n "$KEYSTORE_B64" ] || { echo "keystore не задан — оставляем debug-подпись"; exit 0; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 ci/apk/busbus.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" \
            --out ci/apk/busbus.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ci/apk/busbus.apk

      - name: Verify APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging ci/apk/busbus.apk | head -3
          ls -la ci/apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          [ -f .github/release-notes.md ] || printf 'BusBus %s\n' "$VER" > .github/release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag=false || true
          cp ci/apk/busbus.apk "ci/apk/busbus-$VER.apk"
          gh release create "$TAG" "ci/apk/busbus-$VER.apk" \
            --title "BusBus $VER" \
            --notes-file .github/release-notes.md \
            --verify-tag
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) байт"'

      - name: Publish APK to ci/apk branch
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/apk/busbus.apk ci/apk/busbus-debug.apk
          git commit -m "ci: apk $(date -u +%F-%H%M)" || true
          git push origin HEAD:refs/heads/ci/apk --force

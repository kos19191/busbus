name: geo
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths:
      - 'core/src/data/demo-lines.ts'
      - 'scripts/build-geo.mjs'
      - '.github/workflows/geo.yml'
permissions:
  contents: write
jobs:
  build-geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Route demo lines via OSRM
        run: node scripts/build-geo.mjs
      - name: Commit geometry if changed
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add core/src/data/demo-geo.json
          git diff --cached --quiet && echo "без изменений" && exit 0
          git commit -m "data: demo route geometry from OSRM"
          git push origin HEAD:refs/heads/ci/geo --force

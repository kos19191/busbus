name: pages
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths:
      - 'web/**'
      - 'core/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            web/package-lock.json
      - name: Build PWA
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund && npm run build)
      - name: Attach latest APK (if published by android workflow)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p web/dist
          gh api "repos/${{ github.repository }}/contents/ci/apk/busbus.apk?ref=ci/apk" --jq '.content' \
            | base64 -d > web/dist/busbus.apk
          ls -la web/dist/busbus.apk
      # Резервный канал: даже если GitHub Pages в репозитории не включён,
      # собранная PWA лежит в ветке ci/pages и доступна по адресу
      # https://kos19191.github.io/busbus/ (после включения Pages → Deploy from branch)
      - name: Publish build to ci/pages
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          rm -rf /tmp/pwa && mkdir -p /tmp/pwa
          cp -r web/dist/. /tmp/pwa/
          touch /tmp/pwa/.nojekyll
          cd /tmp/pwa
          git init -q -b main .
          git -c user.name="Arena Agent" -c user.email="agent@arena.ai" add -A
          git -c user.name="Arena Agent" -c user.email="agent@arena.ai" commit -qm "build: PWA ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci/pages

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: web/dist
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

name: pages
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths:
      - 'web/**'
      - 'core/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            web/package-lock.json
      - name: Build PWA
        run: |
          (cd core && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund && npm run build)
      - name: Fetch latest APK for download link
        continue-on-error: true
        run: |
          mkdir -p web/dist
          for branch in ci/shots ci/apk; do
            if gh api "repos/${{ github.repository }}/contents/ci/apk/busbus.apk?ref=$branch" --jq '.content' 2>/dev/null | base64 -d > web/dist/busbus.apk; then
              echo "APK получен из ветки $branch"; break
            fi
          done
          ls -la web/dist/busbus.apk || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

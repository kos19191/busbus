name: ui-check
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths-ignore: ['.github/workflows/probe.yml', '.github/probe.sh']
permissions:
  contents: write
jobs:
  build-and-shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install core deps
        working-directory: core
        run: npm ci --no-audit --no-fund

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck core
        working-directory: core
        run: npm run typecheck

      - name: Build PWA
        working-directory: web
        run: npm run build

      - name: Smoke test with puppeteer
        working-directory: web
        run: |
          which google-chrome chrome chromium chromium-browser || true
          ls /usr/bin | grep -i chrom | head -5 || true
          npx vite preview --outDir dist --port 4173 --host 127.0.0.1 &
          sleep 4
          node ./scripts/screenshot.mjs

      - name: Publish screenshots
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/shots/*.png ci/shots/index.html || true
          git commit -m "ci: ui screenshots" || true
          git push origin HEAD:refs/heads/ci/shots --force

      - name: Live mode smoke test
        continue-on-error: true
        working-directory: web
        env:
          SHOT_URL: http://127.0.0.1:4173/
          OUT_DIR: ../ci/live
          LIVE_PROXY: ${{ vars.LIVE_PROXY }}
        run: |
          npx vite preview --outDir dist --port 4173 --host 127.0.0.1 &
          sleep 4
          node ./scripts/live-check.mjs

      - name: Publish live report
        continue-on-error: true
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f ci/live/* || true
          git commit -m "ci: live mode report" || true
          git push origin HEAD:refs/heads/ci/shots --force

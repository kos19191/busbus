name: probe
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Headers NSK
        run: curl -sS -m 30 -D - -o /dev/null "https://map.nskgortrans.ru/markers.php?r=1-8-W-8" || true
      - name: Headers KRK
        run: curl -sS -m 30 -D - -o /dev/null "https://mu-kgt.ru/informing/wap/marsh/?m=85&action=getMarshData" || true
      - name: Headers busti
        run: curl -sS -m 30 -D - -o /dev/null "https://ru.busti.me/api/v1/datasources/" || true
      - name: Headers OSM tiles
        run: curl -sS -m 30 -D - -o /dev/null -A "BusBus/1.0 (contact: test@example.com)" "https://tile.openstreetmap.org/13/5982/2590.png" || true
      - name: KRK full page
        run: |
          curl -sS -m 60 "https://mu-kgt.ru/informing/" -o page.html
          wc -c page.html
          grep -oE '(src|href)="[^"]+"' page.html | sort -u | head -60
          grep -oE 'action=[A-Za-z_]+' page.html | sort -u | head -40
      - name: KRK js scan
        run: |
          grep -oE 'src="[^"]+\.js[^"]*"' page.html | sed 's/src="//;s/"$//' | sort -u > jslist.txt
          cat jslist.txt
          while read -r f; do
            echo "=== $f"
            curl -sS -m 60 "https://mu-kgt.ru$f" -o js.tmp
            wc -c js.tmp
            grep -oE 'action=[A-Za-z_]+' js.tmp | sort -u | head -30
            grep -oE 'url[^;]{0,120}' js.tmp | head -30
          done < jslist.txt
      - name: NSK minibus + stop board
        run: |
          curl -sS -m 30 "https://map.nskgortrans.ru/markers.php?r=8-29-W-29" | head -c 600
          echo
          curl -sS -m 30 "https://map.nskgortrans.ru/components/com_planrasp/helpers/grasp.php?q=%D0%92%D0%BE%D0%BA%D0%B7%D0%B0%D0%BB&typeview=stops" | head -c 800
          echo
          curl -sS -m 30 "https://m.nskgortrans.ru/index.php?m=8&t=2&tt=1&s=0&r=A&p=1" | head -c 800
      - name: busti api
        run: |
          curl -sS -m 30 "https://ru.busti.me/api/v1/datasources/" | head -c 1000
          echo
          curl -sS -m 30 "https://ru.busti.me/api/v1/routes/?city_id=1" | head -c 1000
      - name: overpass test
        run: |
          curl -sS -m 120 -G "https://overpass-api.de/api/interpreter" --data-urlencode 'data=[out:json][timeout:60];node(55.0,82.9,55.02,82.93)[public_transport=platform];out 3;' | head -c 800
      - name: proxies
        run: |
          curl -sS -m 40 -D - "https://api.codetabs.com/v1/proxy?quest=https://map.nskgortrans.ru/markers.php?r%3D1-8-W-8" | head -c 700
          echo
          curl -sS -m 40 -D - "https://api.allorigins.win/raw?url=https%3A%2F%2Fmap.nskgortrans.ru%2Fmarkers.php%3Fr%3D1-8-W-8" | head -c 700

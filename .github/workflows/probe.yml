name: probe
on:
  workflow_dispatch:
  push:
    branches: [arena/e840c013-busbus]
    paths: ['.github/probe.sh', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: bash .github/probe.sh > probe_out.txt 2>&1 || true
      - name: Publish results
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          mkdir -p ci
          cp probe_out.txt ci/probe_out.txt
          git add -f ci/probe_out.txt
          git commit -m "ci: probe results" || true
          git push origin HEAD:refs/heads/ci/probe --force
